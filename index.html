<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shakeit08 · BOTS</title>
<meta name="description" content="RisuAI 봇 소개 페이지 모음">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,100..125,400..900&family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1468f0;--navy:#13205a;--pink:#ffb8d2;--lime:#c9f29b;--red:#ff4b5c;--bg:#eef1f6;--mute:#5b6694}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--navy);font-family:"Noto Sans KR",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.ck{height:32px;background:conic-gradient(#fff 25%,var(--blue) 0 50%,#fff 0 75%,var(--blue) 0) 0 0/32px 32px}
header{background:var(--blue);color:#fff;text-align:center;padding:46px 18px 40px}
header small{font-family:"Space Mono",monospace;letter-spacing:.3em;font-size:12px;color:#dbe7ff}
header h1{font-family:Archivo,sans-serif;font-style:italic;font-weight:900;font-stretch:120%;font-size:clamp(44px,9vw,92px);line-height:1;margin-top:10px;text-shadow:6px 6px 0 var(--navy)}
main{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:40px 18px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;align-items:start}
.bot{display:block;text-decoration:none;color:inherit;background:#fff;border:3px solid var(--navy);box-shadow:7px 7px 0 var(--c,var(--blue));transition:transform .15s,box-shadow .15s}
a.bot:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--c,var(--blue))}
.bot .img{aspect-ratio:2/1;background:var(--c,var(--blue)) center/cover;border-bottom:3px solid var(--navy)}
.bot .tx{padding:12px 14px 14px}
.bot .tag{display:inline-block;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;padding:2px 8px;border:2px solid var(--navy);background:var(--c,var(--blue));color:var(--t,#fff)}
.bot h2{font-size:20px;font-weight:900;margin-top:8px;line-height:1.3}
.bot p{font-size:13px;color:var(--mute);margin-top:4px}
.bot.soon{opacity:.55;box-shadow:7px 7px 0 #c9d4ea}
.bot.soon .img{display:grid;place-items:center;font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.2em;color:var(--mute);background:repeating-linear-gradient(45deg,#e7efff 0 12px,#f6f8fc 12px 24px)}
footer{background:var(--navy);color:#dbe7ff;text-align:center;font-size:12px;padding:18px}
</style>
</head>
<body>
<div class="ck"></div>
<header><small>✦ RISUAI BOT ARCHIVE ✦</small><h1>BOTS</h1></header>
<div class="ck"></div>
<main id="list"></main>
<footer>shakeit08.github.io</footer>
<script>
/* 봇 추가: 아래 목록에 한 줄씩 추가 (url은 저장소 이름, img는 이 저장소에 넣은 썸네일) */
const BOTS=[
  {url:"nextstage/",img:"nextstage.jpg",title:"NEXT STAGE",sub:"남자 아이돌 서바이벌 RP · 시즌 1",tag:"IDOL SURVIVAL",c:"#1468f0",t:"#fff"},
  {soon:true,title:"NEXT BOT",sub:"준비 중",tag:"COMING SOON",c:"#ffb8d2",t:"#13205a"}
];
const L=document.getElementById("list");
BOTS.forEach(b=>{const e=document.createElement(b.soon?"div":"a");e.className="bot"+(b.soon?" soon":"");if(!b.soon)e.href=b.url;
 e.style.setProperty("--c",b.c);e.style.setProperty("--t",b.t);
 e.innerHTML=`<div class="img"${b.img?` style="background-image:url('${b.img}')"`:""}>${b.soon?"COMING SOON":""}</div><div class="tx"><span class="tag">${b.tag}</span><h2>${b.title}</h2><p>${b.sub}</p></div>`;L.append(e)});
</script>
</body>
</html>
