<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shakeit08 · ARCHIVE</title>
<meta name="description" content="RisuAI 봇 보관함">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f10;--bg2:#181819;--card:#202022;--line:#2c2c2f;--txt:#ececec;--mute:#9a9a9f;--dim:#6c6c72;--acc:#ff5a4e;--acc2:#ffb648;--g:#46d39a;
  --disp:"Bebas Neue","Noto Sans KR",sans-serif;--body:"Noto Sans KR",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:15px;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:28px;padding:14px clamp(16px,4vw,56px);
  background:linear-gradient(#0f0f10f0,#0f0f1000);transition:background .3s}
nav.solid{background:#0f0f10f2}
.logo{font:400 30px/1 var(--disp);letter-spacing:.04em;color:var(--acc)}
.logo span{color:var(--txt)}
.menu{display:flex;gap:20px;font-size:14px;color:#cfcfd2}
.menu a{transition:color .2s}.menu a:hover,.menu a.on{color:#fff;font-weight:700}
.sp{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid transparent;padding:4px 8px;transition:.25s}
.search.open{border-color:#fff8;background:#000a}
.search input{width:0;background:none;border:0;color:#fff;font:inherit;font-size:14px;outline:none;transition:width .3s}
.search.open input{width:180px}
.search svg{width:20px;height:20px;cursor:pointer;flex:none}
.owner{font-size:12px;color:var(--mute);letter-spacing:.08em}
@media(max-width:820px){.menu{display:none}.owner{display:none}.search.open input{width:130px}}

/* billboard */
.bb{position:relative;height:min(82vh,760px);min-height:520px;overflow:hidden}
.bb .slide{position:absolute;inset:0;opacity:0;transition:opacity 1s;pointer-events:none}
.bb .slide.on{opacity:1;pointer-events:auto}
.bb .bgi{position:absolute;top:0;right:0;width:74%;height:100%;object-fit:cover;object-position:center 30%;animation:kb 18s ease-out both}
.slide:not(.on) .bgi{animation:none}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.bb .slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 26%,#0f0f10cc 40%,#0f0f1000 70%),linear-gradient(0deg,var(--bg) 0%,#0f0f1000 30%)}
.bb .cp{position:absolute;z-index:2;left:clamp(16px,4vw,56px);bottom:clamp(90px,16vh,150px);max-width:min(560px,90vw)}
.kicker{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--mute)}
.kicker b{color:var(--acc);font-family:var(--disp);font-size:22px;letter-spacing:.06em;font-weight:400}
.bb h1{font:400 clamp(56px,8vw,104px)/.9 var(--disp);letter-spacing:.02em;margin:10px 0 4px;text-shadow:0 4px 30px #0008}
.bb .ko{font-size:16px;color:#d8d8dc;font-weight:500}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:14px 0 10px;font-size:13.5px;color:#cfcfd2}
.meta .m{color:var(--g);font-weight:700}
.chip{border:1px solid #fff6;padding:0 7px;font-size:12px;border-radius:3px}
.chip.o1{border-color:var(--acc2);color:var(--acc2)}.chip.o2{border-color:#7fb3ff;color:#7fb3ff}
.bb p{color:#e4e4e7;font-size:15.5px;max-width:34em;text-shadow:0 2px 10px #000a}
.acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.b1,.b2{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:5px;font-weight:700;font-size:15.5px;transition:.2s}
.b1{background:#fff;color:#111}.b1:hover{background:#ffffffc8}
.b2{background:#6d6d7299;color:#fff}.b2:hover{background:#6d6d7266}
.b1 svg,.b2 svg{width:20px;height:20px}
.dots{position:absolute;z-index:3;right:clamp(16px,4vw,56px);bottom:clamp(90px,16vh,150px);display:flex;gap:6px}
.dots button{width:22px;height:3px;background:#fff4;transition:.3s}
.dots button.on{background:#fff;width:34px}
@media(max-width:760px){.bb{height:auto;min-height:640px}.bb .bgi{width:100%;height:56%}.bb .slide::after{background:linear-gradient(0deg,var(--bg) 46%,#0f0f10d0 56%,#0f0f1000 78%)}.bb .cp{bottom:96px}.dots{left:16px;right:auto;bottom:66px}}

/* rows */
main{position:relative;z-index:3;margin-top:-80px;padding-bottom:40px}
.tw{position:relative}
.arr{position:absolute;top:16px;height:calc(clamp(240px,23vw,340px)*.5625);z-index:5;width:clamp(16px,4vw,56px);display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1;color:#fff;background:#000a;border:0;cursor:pointer;opacity:0;transition:opacity .2s,background .2s}
.arr.al{left:0}.arr.ar{right:0}
.tw:hover .arr{opacity:1}.arr:hover{background:#000d}
.num .arr{height:clamp(240px,23vw,340px)}
.tw.at-s .arr.al,.tw.at-e .arr.ar{opacity:0!important;pointer-events:none}
@media(hover:none){.arr{display:none}}
.row{margin-bottom:38px}
.row h2{font-size:clamp(17px,1.6vw,21px);font-weight:700;padding:0 clamp(16px,4vw,56px);margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.row h2 small{font-size:12px;color:var(--dim);font-weight:500;letter-spacing:.06em}
.track{display:flex;gap:10px;overflow-x:auto;padding:16px clamp(16px,4vw,56px) 22px;margin:-16px 0 -22px;scroll-snap-type:x proximity;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.cd{flex:none;width:clamp(240px,23vw,340px);scroll-snap-align:start;position:relative;border-radius:6px;overflow:hidden;background:var(--card);cursor:pointer;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;transform-origin:center}
.cd:hover{transform:scale(1.07);box-shadow:0 18px 40px #000c;z-index:5}
.cd .th{aspect-ratio:16/9;position:relative}
.cd .th img{width:100%;height:100%;object-fit:cover}
.cd .th::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000d 0%,#0000 55%)}
.cd .nm{position:absolute;z-index:2;left:12px;right:12px;bottom:8px;font:400 26px/1 var(--disp);letter-spacing:.03em;text-shadow:0 2px 8px #000}
.cd .bdg{position:absolute;z-index:2;top:8px;right:8px;font:400 13px/1 var(--disp);letter-spacing:.1em;background:var(--acc);color:#fff;padding:4px 7px 3px;border-radius:3px}
.cd .og{position:absolute;z-index:2;top:8px;left:8px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;background:#000a}
.cd .og.o1{color:var(--acc2)}.cd .og.o2{color:#7fb3ff}
.cd .more{max-height:0;overflow:hidden;transition:max-height .35s ease;background:var(--card)}
.cd:hover .more{max-height:140px}
.cd .more .in{padding:10px 12px 12px}
.ic{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ic a,.ic button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff8;transition:.2s;font-size:13px}
.ic a:first-child{background:#fff;color:#111;border-color:#fff}
.ic a:hover,.ic button:hover{border-color:#fff}
.ic svg{width:16px;height:16px}
.ic .r{margin-left:auto;font-size:12px;color:var(--g);font-weight:700}
.cd .tg{font-size:12px;color:#cfcfd2}
.cd .tg i{font-style:normal;color:var(--dim);margin:0 4px}
@media(hover:none){.cd:hover{transform:none}.cd .more{max-height:none}}

/* numbered row */
.num .cd{width:clamp(280px,27vw,390px);display:grid;grid-template-columns:34% 66%;background:none;overflow:visible}
.num .cd:hover{box-shadow:none}
.num .big{font:400 clamp(110px,10vw,150px)/.78 var(--disp);color:var(--bg);-webkit-text-stroke:2px #8a8a90;align-self:end;text-align:right;padding-right:4px;letter-spacing:-.04em}
.num .cd .th{border-radius:6px;overflow:hidden;aspect-ratio:1/1}
.num .cd .nm{font-size:22px}

/* results */
.results{padding:110px clamp(16px,4vw,56px) 40px;display:none}
.results.on{display:block}
.results h2{font-size:15px;color:var(--mute);font-weight:500;margin-bottom:16px}
.results .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 10px}
.results .cd{width:auto}
.empty{color:var(--dim);padding:40px 0}

/* modal */
.mo{position:fixed;inset:0;z-index:60;background:#000b;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 12px}
.mo.on{display:flex}
.mbox{width:min(860px,100%);background:var(--bg2);border-radius:10px;overflow:hidden;box-shadow:0 30px 80px #000;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.mh{position:relative;aspect-ratio:16/8}
.mh img{width:100%;height:100%;object-fit:cover}
.mh::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2) 2%,#18181900 55%)}
.mh .x{position:absolute;z-index:3;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:#181819;font-size:18px}
.mh .cp{position:absolute;z-index:2;left:clamp(18px,4vw,44px);bottom:16px;right:20px}
.mh h3{font:400 clamp(40px,6vw,64px)/.9 var(--disp);letter-spacing:.02em}
.mb{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;padding:8px clamp(18px,4vw,44px) 36px}
.mb p{font-size:15px;color:#e1e1e4}
.mb dl{font-size:13.5px;color:var(--dim)}
.mb dl div{margin-bottom:6px}
.mb dd{display:inline;color:#d6d6da}
@media(max-width:620px){.mb{grid-template-columns:1fr}}

footer{padding:36px clamp(16px,4vw,56px) 50px;color:var(--dim);font-size:12px;letter-spacing:.06em;border-top:1px solid var(--line)}
footer b{color:var(--mute);font-weight:500}
</style>
</head>
<body>

<nav id="nav">
  <a class="logo" href="#">SHAKEIT<span>08</span></a>
  <div class="menu" id="menu">
    <a href="#" data-go="top" class="on">홈</a>
    <a href="#r-sim">시뮬레이션</a>
    <a href="#r-char">캐릭터</a>
    <a href="#r-o1">1차 창작</a>
    <a href="#r-o2">2차 창작</a>
  </div>
  <div class="sp"></div>
  <label class="search" id="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="제목·태그 검색" aria-label="검색">
  </label>
  <span class="owner">RISUAI · BOT ARCHIVE</span>
</nav>

<header class="bb" id="bb"></header>
<main id="main"></main>
<section class="results" id="results"><h2 id="rh"></h2><div class="grid" id="grid"></div></section>

<div class="mo" id="mo"><div class="mbox" id="mbox"></div></div>

<footer><b>SHAKEIT08.GITHUB.IO</b> · RisuAI 봇 보관함 · <span id="cnt"></span></footer>

<script src="bots.js"></script>
<script>
const $=s=>document.querySelector(s);
const items=BOTS.map((b,i)=>({...b,no:String(i+1).padStart(3,"0"),i}));
const byDate=[...items].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.i-a.i);
const OG={"1차":["o1","1차 창작"],"2차":["o2","2차 창작"]};
const TY={"시뮬":"시뮬레이션","캐릭터":"캐릭터 봇"};
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const INFO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>';
const main=b=>b.links&&(b.links.page||b.links.realm||b.links.arca);
const tgt=(k)=>k==="page"?"_self":"_blank";
const thumb=b=>b.thumb?`thumbs/${b.thumb}`:"";
$("#cnt").textContent=`FILES ${items.length} · LAST ${byDate[0]?.date||"—"}`;

/* billboard */
const feat=byDate.filter(b=>main(b));let fi=0,ft;
function bbHTML(b,k){const lk=b.links||{};const o=OG[b.origin];
  return `<div class="slide${k===0?" on":""}"><img class="bgi" src="${b.hero||thumb(b)}" alt="">
  <div class="cp"><div class="kicker"><b>No.${b.no}</b> ${TY[b.type]||""}</div>
  <h1>${b.title}</h1><div class="ko">${b.ko||""}</div>
  <div class="meta"><span class="m">${b.date||""}</span>${o?`<span class="chip ${o[0]}">${o[1]}</span>`:""}${(b.tags||[]).map(t=>`<span>#${t}</span>`).join("")}</div>
  <p>${b.sub||""}</p>
  <div class="acts">${main(b)?`<a class="b1" href="${main(b)}" target="${tgt(lk.page?"page":"x")}" rel="noopener">${PLAY}${lk.page?"소개 페이지":"열기"}</a>`:""}
  <button class="b2" data-open="${b.i}">${INFO}상세 정보</button></div></div></div>`}
$("#bb").innerHTML=feat.map(bbHTML).join("")+`<div class="dots">${feat.map((_,k)=>`<button aria-label="${k+1}"${k===0?' class="on"':""}></button>`).join("")}</div>`;
function bbGo(k){fi=k;$("#bb").querySelectorAll(".slide").forEach((s,j)=>s.classList.toggle("on",j===k));$("#bb").querySelectorAll(".dots button").forEach((d,j)=>d.classList.toggle("on",j===k));clearTimeout(ft);ft=setTimeout(()=>bbGo((fi+1)%feat.length),9000)}
$("#bb").querySelectorAll(".dots button").forEach((d,j)=>d.onclick=()=>bbGo(j));
if(feat.length>1)ft=setTimeout(()=>bbGo(1),9000);

/* cards */
function card(b,numbered){const lk=b.links||{};const o=OG[b.origin];
  const icons=Object.entries(lk).map(([k,u],j)=>`<a href="${u}" target="${tgt(k)}" rel="noopener" title="${k==="page"?"소개 페이지":k==="realm"?"RisuRealm":"Arca"}">${j===0?PLAY:k==="realm"?"R":k==="arca"?"A":"↗"}</a>`).join("");
  const inner=`<div class="th"><img src="${thumb(b)}" alt="" loading="lazy">${o?`<span class="og ${o[0]}">${o[1]}</span>`:""}${b.badge?`<span class="bdg">${b.badge}</span>`:""}<span class="nm">${b.title}</span></div>`;
  const more=`<div class="more"><div class="in"><div class="ic">${icons}<button data-open="${b.i}" title="상세 정보">${INFO}</button><span class="r">${b.date||""}</span></div><div class="tg">${[TY[b.type],...(b.tags||[])].filter(Boolean).join('<i>•</i>')}</div></div></div>`;
  return numbered?`<div class="cd" data-open="${b.i}"><span class="big">${+b.no}</span><div>${inner}</div></div>`:`<div class="cd" data-open="${b.i}">${inner}${more}</div>`}
const ROWS=[
  ["r-new","최근 등록","NEW",byDate],
  ["r-sim","시뮬레이션 봇","SIMULATION",byDate.filter(b=>b.type==="시뮬")],
  ["r-char","캐릭터 봇","CHARACTER",byDate.filter(b=>b.type==="캐릭터")],
  ["r-o1","1차 창작 · 오리지널","ORIGINAL",byDate.filter(b=>b.origin==="1차")],
  ["r-o2","2차 창작 · 팬픽션","FAN FICTION",byDate.filter(b=>b.origin==="2차")],
  ["r-no","만든 순서대로","No.",items,1]
];
$("#main").innerHTML=ROWS.filter(r=>r[3].length).map(([id,t,s,arr,n])=>`<section class="row${n?" num":""}" id="${id}"><h2>${t}<small>${s}</small></h2><div class="tw"><button class="arr al" aria-label="이전">‹</button><div class="track">${arr.map(b=>card(b,n)).join("")}</div><button class="arr ar" aria-label="다음">›</button></div></section>`).join("");
/* row arrows (PC) */
function arrUpd(tr){const w=tr.parentElement;w.classList.toggle("at-s",tr.scrollLeft<8);w.classList.toggle("at-e",tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-8)}
document.querySelectorAll(".tw").forEach(w=>{const tr=w.querySelector(".track");
  const go=d=>{const max=tr.scrollWidth-tr.clientWidth,t=Math.max(0,Math.min(max,tr.scrollLeft+d*tr.clientWidth*.85));
    tr.style.scrollSnapType="none";tr.scrollTo({left:t,behavior:"smooth"});clearTimeout(tr._t);tr._t=setTimeout(()=>{tr.style.scrollSnapType="";arrUpd(tr)},700)};
  w.querySelector(".al").onclick=()=>go(-1);
  w.querySelector(".ar").onclick=()=>go(1);
  tr.addEventListener("scroll",()=>arrUpd(tr),{passive:true});arrUpd(tr)});
addEventListener("resize",()=>document.querySelectorAll(".tw .track").forEach(arrUpd));


/* modal */
function openM(i){const b=items[i];const lk=b.links||{};const o=OG[b.origin];
  $("#mbox").innerHTML=`<div class="mh"><img src="${b.hero||thumb(b)}" alt=""><button class="x" aria-label="닫기">✕</button>
  <div class="cp"><div class="kicker"><b>No.${b.no}</b> ${TY[b.type]||""}</div><h3>${b.title}</h3>
  <div class="acts" style="margin-top:14px">${Object.entries(lk).map(([k,u],j)=>`<a class="${j===0?"b1":"b2"}" href="${u}" target="${tgt(k)}" rel="noopener">${j===0?PLAY:""}${k==="page"?"소개 페이지":k==="realm"?"RisuRealm":"Arca"}</a>`).join("")}</div></div></div>
  <div class="mb"><div><div class="meta" style="margin-top:0"><span class="m">${b.date||""}</span>${o?`<span class="chip ${o[0]}">${o[1]}</span>`:""}${b.badge?`<span class="chip">${b.badge}</span>`:""}</div><div style="font-weight:700;margin-bottom:6px">${b.ko||""}</div><p>${b.sub||""}</p></div>
  <dl><div>장르: <dd>${TY[b.type]||"—"}</dd></div><div>창작 구분: <dd>${o?o[1]:"—"}</dd></div><div>태그: <dd>${(b.tags||[]).join(", ")}</dd></div><div>등록: <dd>${b.date||"—"}</dd></div></dl></div>`;
  $("#mo").classList.add("on");document.body.style.overflow="hidden"}
function closeM(){$("#mo").classList.remove("on");document.body.style.overflow=""}
document.addEventListener("click",e=>{
  if(e.target.closest("a"))return;
  if(e.target.closest(".x")||e.target.id==="mo")return closeM();
  const o=e.target.closest("[data-open]");if(o&&!e.target.closest("#mbox"))openM(+o.dataset.open)});
addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});

/* nav + search */
addEventListener("scroll",()=>$("#nav").classList.toggle("solid",scrollY>40),{passive:true});
$("#search svg").onclick=()=>{$("#search").classList.add("open");$("#q").focus()};
$("#q").onblur=()=>{if(!$("#q").value)$("#search").classList.remove("open")};
$("#q").oninput=e=>{const q=e.target.value.trim().toLowerCase();const on=!!q;
  $("#bb").style.display=$("#main").style.display=on?"none":"";$("#results").classList.toggle("on",on);
  if(!on)return;const r=items.filter(b=>[b.title,b.ko,b.sub,b.type,b.origin&&OG[b.origin]?.[1],...(b.tags||[])].join(" ").toLowerCase().includes(q));
  $("#rh").textContent=`"${e.target.value}" 검색 결과 ${r.length}개`;
  $("#grid").innerHTML=r.length?r.map(b=>card(b)).join(""):`<div class="empty">찾는 봇이 없어요.</div>`};
document.querySelector('[data-go="top"]').onclick=e=>{e.preventDefault();scrollTo({top:0,behavior:"smooth"})};
</script>
</body>
</html>
