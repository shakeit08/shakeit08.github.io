  let framed=true;try{framed=window.self!==window.top;}catch(_){}

  try{const [db,user]=await Promise.all([C.use('db'),C.use('user')]);if(!db||!user)return null;const id=await user.id();if(!id)return null;
   return{doc:k=>db.doc('data/users/'+id+'/'+k.replace(/[^A-Za-z0-9_.~:@+-]/g,'_'))};}catch(_){return null;}})();return cloudP;}
 const timeout=(p,ms)=>Promise.race([p,sleep(ms).then(()=>null)]);
 const writing={},queued={};let cloudOff=false;
 async function push(k){if(cloudOff||writing[k])return;writing[k]=true;try{while(queued[k]!=null){const body=queued[k];queued[k]=null;const c=await cloud();if(!c){cloudOff=true;break;}

 let started=false;
 window.risuai={
  pluginStorage:{
   async getItem(k){const local=unwrap(lsGet(k));let remote=null;
    try{const c=await timeout(cloud(),4000);if(c){const snap=await timeout(c.doc(k).get(),4000);const d=snap&&snap.exists&&snap.data();if(d&&typeof d.save==='string')remote={t:+d.t||0,v:d.save};}}catch(_){}
    const best=remote&&(!local||remote.t>local.t)?remote:local;if(best&&best===remote)lsSet(k,JSON.stringify(remote));return best?best.v:null;},

 function dialog(msg,two){return new Promise(res=>{const o=document.createElement('div');o.className='webdlg';
  o.innerHTML='<div class="webcard"><p></p><div class="webrow">'+(two?'<button class="btn" data-v="0">취소</button>':'')+'<button class="btn green" data-v="1">확인</button></div></div>';
  o.querySelector('p').textContent=msg;o.addEventListener('click',e=>{const b=e.target.closest('button');if(!b&&e.target!==o)return;o.remove();res(b?b.dataset.v==='1':false);});
  (document.getElementById('shell')||document.body).append(o);o.querySelector('.green').focus();});}

 window.alert=m=>{void dialog(String(m),false);};
